name: CI

on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main, qa]
  schedule:
    - cron: '17 9 * * 1' # weekly: catch newly published advisories against the locked libraries

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Audit, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: No known vulnerabilities in dependencies
        run: npm audit --audit-level=low

      - name: Committed build matches the source
        run: |
          npm run build
          git diff --exit-code -- dist || (echo "dist/ is out of date: run npm run build and commit" && exit 1)

      - name: LibreOffice and openpyxl for spreadsheet checks
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-calc
          python3 -m pip install --quiet openpyxl

      - name: Unit, integrity and spreadsheet checks
        run: npm test

      - name: Browser for the end-to-end run
        run: npx playwright install --with-deps chromium

      - name: Privacy and end-to-end checks (several people at once)
        run: npm run test:e2e
