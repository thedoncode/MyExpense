name: CI

on:
  push:
    branches: [main, qa]
  pull_request:
    branches: [main, qa]
  schedule:
    - cron: '17 9 * * 1' # weekly: catch newly published advisories against the locked libraries

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Audit, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      # The web version's database: Hostinger's shared hosting reports MariaDB 10.11
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '3306'
      TEST_DB_USER: root
      TEST_DB_PASSWORD: ci-only-root-password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: No known vulnerabilities in dependencies
        run: npm audit --audit-level=low

      - name: Committed build matches the source
        run: |
          npm run build
          test -z "$(git status --porcelain -- dist)" || (git status --short -- dist; echo "dist/ is out of date: run npm run build and commit" && exit 1)

      - name: LibreOffice and openpyxl for spreadsheet checks
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-calc
          python3 -m pip install --quiet openpyxl

      - name: Unit, integrity and spreadsheet checks
        run: npm test

      - name: Browser for the end-to-end run
        run: npx playwright install --with-deps chromium

      - name: Privacy and end-to-end checks (several people at once)
        run: npm run test:e2e

      - name: Database limits like shared hosting (4 MB packets)
        run: mysql -h 127.0.0.1 -P 3306 -u root -p"$TEST_DB_PASSWORD" -e "SET GLOBAL max_allowed_packet = 4194304"

      - name: Web server security checks (real database)
        run: npm run test:server

      - name: Web version end-to-end (sign-in with two-step codes, several people at once)
        run: npm run test:e2e-web
